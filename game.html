<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meteor Dodge — built from one prompt</title>
<style>
  html, body { margin: 0; height: 100%; background: #070312; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #0a0618; border-radius: 12px;
           box-shadow: 0 0 60px rgba(180, 60, 220, .35);
           width: min(96vw, calc(90vh * 16 / 9)); height: auto; }
  #hint { position: fixed; bottom: 14px; left: 0; width: 100%; text-align: center;
          color: #9d8fd0; font: 14px/1.4 system-ui, sans-serif; letter-spacing: .04em; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="hint">&#8592; &#8594; or A / D to fly &nbsp;&middot;&nbsp; dodge the meteors &nbsp;&middot;&nbsp; how long can you survive?</div>
<script>
'use strict';
// METEOR DODGE — a tiny one-prompt browser game.
// One prompt: "Build me a tiny browser game: dodge the meteors, one button, make it fun."
// Fly the rocket, dodge the falling meteors, survive as long as you can.
// ?auto=1  -> the ship flies itself (autopilot, used for the demo video)
// ?seed=N  -> fixed random seed, so every run plays the same meteors

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const params = new URLSearchParams(location.search);
const AUTO = params.get('auto') === '1';
let seed = Number(params.get('seed') || 7) >>> 0;

// Small seeded RNG (mulberry32) so a run is reproducible.
function rng() {
  seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

const ship = { x: W / 2, y: H - 70, r: 16, vx: 0 };
const meteors = [];
const stars = [];
for (let i = 0; i < 90; i++) {
  stars.push({ x: rng() * W, y: rng() * H, s: rng() * 1.8 + 0.4, tw: rng() * 6.28 });
}
let keys = {};
let score = 0;            // seconds survived
let over = false;
let overAt = 0;
let spawnTimer = 0;
let startTime = performance.now();
let last = startTime;
let flashes = [];

addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'r' || e.key === 'R') reset();
  if (['arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase())) e.preventDefault();
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('pointermove', (e) => {
  const r = canvas.getBoundingClientRect();
  ship.x = (e.clientX - r.left) * (W / r.width);
});

function reset() {
  meteors.length = 0; flashes.length = 0;
  ship.x = W / 2; ship.vx = 0;
  score = 0; over = false; spawnTimer = 0;
  startTime = performance.now(); last = startTime;
}

// Pick the safest x: for each lane, project every meteor to the moment it
// reaches the ship's height and keep the lane furthest from any impact point.
function autopilot(dt) {
  let bestX = ship.x, bestGap = -1;
  for (let x = 40; x <= W - 40; x += 20) {
    let gap = 1e9;
    for (const m of meteors) {
      if (m.y >= ship.y || m.vy <= 0) continue;
      const tHit = (ship.y - m.y) / m.vy;
      if (tHit > 1.6) continue; // too far away to matter yet
      const xHit = m.x + m.vx * tHit;
      gap = Math.min(gap, Math.abs(xHit - x) - m.r);
    }
    // Slight pull toward the middle so the ship does not hug a wall.
    gap -= Math.abs(x - W / 2) * 0.02;
    if (gap > bestGap) { bestGap = gap; bestX = x; }
  }
  const dx = bestX - ship.x;
  ship.vx = Math.max(-620, Math.min(620, dx * 9));
  ship.x += ship.vx * dt;
}

function spawnMeteor() {
  const r = 12 + rng() * 22;
  meteors.push({
    x: r + rng() * (W - 2 * r),
    y: -r - 10,
    r,
    vy: 130 + rng() * 110 + Math.min(score * 7, 150),
    vx: (rng() - 0.5) * 40,
    rot: rng() * 6.28,
    vr: (rng() - 0.5) * 2.4,
    shade: 120 + Math.floor(rng() * 80),
  });
}

function update(dt) {
  if (over) {
    for (let i = flashes.length - 1; i >= 0; i--) {
      const f = flashes[i];
      f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt;
      if (f.life <= 0) flashes.splice(i, 1);
    }
    // In autopilot demo mode, start a fresh run shortly after a crash
    // so the footage keeps showing live play instead of a frozen screen.
    if (AUTO && performance.now() - overAt > 1400) reset();
    return;
  }
  score += dt;

  if (!AUTO) {
    const dir = (keys['arrowright'] || keys['d'] ? 1 : 0) - (keys['arrowleft'] || keys['a'] ? 1 : 0);
    ship.vx = dir * 420;
    ship.x += ship.vx * dt;
  } else {
    autopilot(dt);
  }
  ship.x = Math.max(24, Math.min(W - 24, ship.x));

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnMeteor();
    // Meteors come faster the longer you survive.
    spawnTimer = Math.max(0.3, 0.85 - score * 0.02) * (0.7 + rng() * 0.6);
  }

  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.y += m.vy * dt; m.x += m.vx * dt; m.rot += m.vr * dt;
    const d = Math.hypot(m.x - ship.x, m.y - ship.y);
    if (d < m.r + ship.r - 6) {
      over = true;
      overAt = performance.now();
      for (let k = 0; k < 26; k++) {
        flashes.push({ x: ship.x, y: ship.y, vx: (rng() - 0.5) * 360,
                       vy: (rng() - 0.5) * 360, life: 0.7 + rng() * 0.5 });
      }
      return;
    }
    if (m.y - m.r > H + 20) meteors.splice(i, 1);
  }
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i];
    f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt;
    if (f.life <= 0) flashes.splice(i, 1);
  }
}

function drawShip() {
  ctx.save();
  ctx.translate(ship.x, ship.y);
  // Flame
  const flick = 10 + Math.random() * 8;
  ctx.fillStyle = '#ff9d2e';
  ctx.beginPath();
  ctx.moveTo(-7, 14); ctx.lineTo(0, 14 + flick + 8); ctx.lineTo(7, 14);
  ctx.closePath(); ctx.fill();
  // Body
  ctx.fillStyle = '#e8ecff';
  ctx.beginPath();
  ctx.moveTo(0, -20); ctx.quadraticCurveTo(13, -2, 11, 12);
  ctx.lineTo(-11, 12); ctx.quadraticCurveTo(-13, -2, 0, -20);
  ctx.closePath(); ctx.fill();
  // Window + fins
  ctx.fillStyle = '#37c8ff';
  ctx.beginPath(); ctx.arc(0, -2, 5.5, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#ff4d6d';
  ctx.beginPath(); ctx.moveTo(-11, 6); ctx.lineTo(-20, 16); ctx.lineTo(-11, 14); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(11, 6); ctx.lineTo(20, 16); ctx.lineTo(11, 14); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawMeteor(m) {
  ctx.save();
  ctx.translate(m.x, m.y); ctx.rotate(m.rot);
  ctx.fillStyle = `rgb(${m.shade}, ${Math.floor(m.shade * 0.55)}, ${Math.floor(m.shade * 0.4)})`;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * 6.283;
    const rr = m.r * (0.82 + ((i * 37) % 10) / 40);
    ctx[i === 0 ? 'moveTo' : 'lineTo'](Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255, 190, 90, .85)';
  ctx.beginPath(); ctx.arc(-m.r * 0.3, -m.r * 0.3, m.r * 0.22, 0, 6.29); ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  // Starfield
  const t = performance.now() / 1000;
  for (const s of stars) {
    ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t + s.tw));
    ctx.fillStyle = '#cfd6ff';
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  for (const m of meteors) drawMeteor(m);
  if (!over) drawShip();
  for (const f of flashes) {
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = '#ffb347';
    ctx.fillRect(f.x - 2, f.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // HUD
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 26px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`SCORE  ${score.toFixed(1)}s`, 18, 38);
  ctx.fillStyle = '#b7a8e8';
  ctx.font = '600 15px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(AUTO ? 'AUTOPILOT — built from one prompt' : 'METEOR DODGE — built from one prompt', W - 18, 36);

  if (over) {
    ctx.fillStyle = 'rgba(5, 2, 16, .72)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff5d7a';
    ctx.font = '800 54px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 30);
    ctx.fillStyle = '#ffffff';
    ctx.font = '600 26px system-ui, sans-serif';
    ctx.fillText(`You survived ${score.toFixed(1)} seconds`, W / 2, H / 2 + 16);
    ctx.fillStyle = '#b7a8e8';
    ctx.font = '500 18px system-ui, sans-serif';
    ctx.fillText('Press R to fly again — made from one prompt on make.fun', W / 2, H / 2 + 52);
  }
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
